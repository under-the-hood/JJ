services:
  redis:
    image: redis:7
    container_name: redis-local
    ports:
      - 6379:6379

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq-local
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ../../.dev.env

  maildev:
    image: maildev/maildev
    container_name: maildev-local
    environment:
      - TZ=Europe/Moscow
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    ports:
      - "8080:1080"
      - "1025:1025"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: meilisearch
    ports:
      - "7700:7700"
    env_file:
      - ../../.dev.env

volumes:
  rabbitmq_data: