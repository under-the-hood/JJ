[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    "app/backend/migrations",
]

[tool.ruff.linter]
select = ["E", "F", "I", "W"]

ignore = [
    "E501"
]

[tool.ruff.linter.per-file-ignores]
"app/backend/migrations/versions/*" = ["E", "F", "I", "W"]